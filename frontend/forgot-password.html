<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | GeoAttend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .saas-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            color: #0f172a;
            outline: 2px solid transparent;
            outline-offset: 2px;
            transition-property: all;
            transition-duration: 200ms;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .saas-input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 1px #0284c7;
        }

        .saas-card {
            background-color: #ffffff;
            border: 1px solid #f1f5f9;
            border-radius: 0.75rem;
            box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }

        .saas-card:hover {
            box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.08);
        }

        .btn-primary {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background-color: #0284c7;
            color: #ffffff;
            border-radius: 0.5rem;
            font-weight: 600;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>

<body>
    <div class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
        <!-- Background design elements -->
        <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-[#0284c7]/5 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-indigo-50/50 rounded-full blur-3xl transform -translate-x-1/2 translate-y-1/2"></div>

        <div class="w-full max-w-md relative z-10">
            <!-- Logo Area -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-slate-900 text-white shadow-[0_8px_16px_rgba(0,0,0,0.1)] mb-4">
                    <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Account Recovery</h2>
                <p class="mt-2 text-slate-500 font-medium text-sm">Follow instructions to reset your password securely.</p>
            </div>

            <div class="saas-card p-8 sm:p-10 relative overflow-hidden">
                <!-- Top highlight bar -->
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-slate-700 to-slate-900"></div>

                <!-- Step 1: Send OTP -->
                <div id="reset-step-1">
                    <h3 class="text-xl font-bold text-slate-900 mb-2">Step 1: Your Email</h3>
                    <p class="text-sm text-slate-500 mb-6">Enter your registered email address and we will send a 6-digit OTP to verify your identity.</p>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Email Address</label>
                            <input type="email" id="reset-email" class="saas-input" placeholder="Enter your email" autocomplete="email">
                        </div>
                        <button onclick="sendResetOTP()" id="reset-otp-btn" class="btn-primary w-full bg-slate-900 hover:bg-slate-800">Send Recovery Code</button>
                    </div>
                </div>

                <!-- Step 2: Verify & Form -->
                <div id="reset-step-2" class="hidden">
                    <h3 class="text-xl font-bold text-slate-900 mb-2">Step 2: Authenticate & Reset</h3>
                    <p class="text-sm text-slate-500 mb-6">A code was sent to your email. It expires in 5 minutes.</p>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">6-Digit OTP</label>
                            <input type="text" id="reset-otp" class="saas-input text-center text-xl tracking-widest font-bold" placeholder="000000" maxlength="6">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">New Password</label>
                            <input type="password" id="reset-new-password" class="saas-input" placeholder="Enter your new password" autocomplete="new-password">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Confirm New Password</label>
                            <input type="password" id="reset-confirm-password" class="saas-input" placeholder="Confirm your new password" autocomplete="new-password">
                        </div>
                        <button onclick="performReset()" id="reset-final-btn" class="btn-primary w-full bg-green-600 hover:bg-green-700">Submit New Password</button>
                        
                        <div class="text-center mt-3">
                            <button onclick="resendResetOTP()" id="resend-otp-btn" class="text-sm font-semibold text-[#0284c7] hover:text-[#0369a1] transition-colors disabled:text-slate-400 disabled:cursor-not-allowed mx-auto block">Resend OTP</button>
                            <span id="resend-countdown" class="text-xs text-slate-400 ml-1 hidden block text-center"></span>
                        </div>
                    </div>
                </div>

                <!-- Alert Messages -->
                <div id="reset-msg" class="mt-4 hidden text-sm font-medium p-3 rounded-lg"></div>
            </div>

            <!-- Back Link -->
            <div class="mt-8 text-center text-sm font-medium">
                <a href="student-login.html" class="text-slate-500 hover:text-slate-800 transition-colors inline-flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Back to Login Gateway
                </a>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script>
        let resendCooldownTimer = null;
        const RESEND_COOLDOWN = 30; // seconds

        function startResendCooldown() {
            const btn = document.getElementById('resend-otp-btn');
            const countdown = document.getElementById('resend-countdown');
            let remaining = RESEND_COOLDOWN;

            btn.disabled = true;
            countdown.textContent = `(Wait ${remaining}s)`;
            countdown.classList.remove('hidden');

            if (resendCooldownTimer) clearInterval(resendCooldownTimer);
            resendCooldownTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(resendCooldownTimer);
                    resendCooldownTimer = null;
                    btn.disabled = false;
                    countdown.classList.add('hidden');
                    countdown.textContent = '';
                } else {
                    countdown.textContent = `(Wait ${remaining}s)`;
                }
            }, 1000);
        }

        async function sendResetOTP() {
            const email = document.getElementById('reset-email').value;
            const btn = document.getElementById('reset-otp-btn');
            const msg = document.getElementById('reset-msg');

            if (!email) {
                msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600';
                msg.textContent = 'Please enter a valid email address.';
                msg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';
            msg.classList.add('hidden');

            try {
                const res = await fetch('/api/main?action=forgotPassword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('reset-step-1').classList.add('hidden');
                    document.getElementById('reset-step-2').classList.remove('hidden');
                    msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-blue-50 text-blue-600';
                    msg.textContent = 'OTP dispatched! Please check your inbox.';
                    msg.classList.remove('hidden');
                    startResendCooldown();
                } else {
                    msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600';
                    msg.textContent = data.message || "Failed to locate account.";
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600';
                msg.textContent = "Server connection fault. Try again later.";
                msg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Recovery Code';
            }
        }

        async function resendResetOTP() {
            const email = document.getElementById('reset-email').value;
            const btn = document.getElementById('resend-otp-btn');
            const msg = document.getElementById('reset-msg');

            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const res = await fetch('/api/main?action=forgotPassword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok) {
                    msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-green-50 text-green-600';
                    msg.textContent = 'Resent OTP to ' + email + '. Verify your spam box if missing.';
                    msg.classList.remove('hidden');
                    startResendCooldown();
                } else {
                    msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600';
                    msg.textContent = data.message || 'OTP delivery rejected.';
                    msg.classList.remove('hidden');
                    btn.disabled = false;
                }
            } catch (err) {
                msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600';
                msg.textContent = 'Connection timeout.';
                msg.classList.remove('hidden');
                btn.disabled = false;
            } finally {
                btn.textContent = 'Resend OTP';
            }
        }

        async function performReset() {
            const email = document.getElementById('reset-email').value;
            const otp = document.getElementById('reset-otp').value;
            const newPassword = document.getElementById('reset-new-password').value;
            const confirmPassword = document.getElementById('reset-confirm-password').value;

            const btn = document.getElementById('reset-final-btn');
            const msg = document.getElementById('reset-msg');

            if (!otp || !newPassword || !confirmPassword) {
                msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600';
                msg.textContent = "Complete all fields before submitting.";
                msg.classList.remove('hidden');
                return;
            }

            if (newPassword !== confirmPassword) {
                msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600';
                msg.textContent = "Confirmation password mis-match. Please retype.";
                msg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            try {
                const res = await fetch('/api/main?action=resetPassword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-green-50 text-green-600';
                    msg.textContent = 'Password security cleared! Redirecting...';
                    msg.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = 'student-login.html';
                    }, 2000);
                } else {
                    msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600';
                    msg.textContent = data.message || 'Action denied over invalid OTP mapping.';
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.className = 'mt-4 text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600';
                msg.textContent = 'Lost connection to authentication server.';
                msg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Submit New Password';
            }
        }
    </script>
</body>
</html>
