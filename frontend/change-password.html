<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | GeoAttend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .saas-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            color: #0f172a;
            outline: 2px solid transparent;
            outline-offset: 2px;
            transition-property: all;
            transition-duration: 200ms;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .saas-input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 1px #0284c7;
        }

        .saas-card {
            background-color: #ffffff;
            border: 1px solid #f1f5f9;
            border-radius: 0.75rem;
            box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }

        .saas-card:hover {
            box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.08);
        }

        .btn-primary {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background-color: #0284c7;
            color: #ffffff;
            border-radius: 0.5rem;
            font-weight: 600;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>

<body>
    <div class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-[#0284c7]/5 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-indigo-50/50 rounded-full blur-3xl transform -translate-x-1/2 translate-y-1/2"></div>

        <div class="w-full max-w-md relative z-10">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-slate-900 text-white shadow-[0_8px_16px_rgba(0,0,0,0.1)] mb-4">
                    <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h2 id="welcome-heading" class="text-3xl font-extrabold text-slate-900 tracking-tight">Security Required</h2>
                <p class="mt-2 text-slate-500 font-medium text-sm" id="welcome-message">Please change your temporary password to continue</p>
            </div>

            <div class="saas-card p-8 sm:p-10 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-500 to-orange-500"></div>

                <form id="change-password-form" class="space-y-6">
                    <div id="password-section" class="space-y-5">
                        <div>
                            <label id="old-pwd-label" class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Current Password</label>
                            <input type="password" id="oldPassword" required class="saas-input" placeholder="Enter current password" autocomplete="current-password">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">New Password</label>
                            <input type="password" id="newPassword" required minlength="6" class="saas-input" placeholder="Enter new password" autocomplete="new-password">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Confirm New Password</label>
                            <input type="password" id="confirmPassword" required minlength="6" class="saas-input" placeholder="Confirm new password" autocomplete="new-password">
                        </div>
                    </div>

                    <div id="otp-section" class="hidden space-y-5 pt-4 border-t border-slate-100">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Verification Code (OTP)</label>
                            <div class="flex gap-2">
                                <input type="text" id="otp" class="saas-input flex-1 text-center tracking-[0.2em] font-mono" placeholder="------" maxlength="6">
                                <button type="button" id="request-otp-btn" onclick="requestOTP()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold uppercase tracking-wider rounded-lg border border-slate-200 transition-colors whitespace-nowrap">Send OTP</button>
                            </div>
                            <p id="otp-status" class="text-xs text-slate-500 mt-2 font-medium"></p>
                        </div>
                    </div>

                    <div id="error-msg" class="hidden bg-red-50 border border-red-100 text-red-600 text-sm py-3 px-4 rounded-lg font-medium flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-red-500 shrink-0"></span>
                        <span id="error-text"></span>
                    </div>

                    <button type="submit" id="submit-btn" class="btn-primary py-3.5 text-base w-full bg-slate-900 hover:bg-slate-800 shadow-[0_8px_16px_rgba(0,0,0,0.1)]">
                        <span id="btn-text">Verify & Get OTP</span>
                    </button>
                </form>
            </div>
            
            <div class="mt-8 text-center text-sm font-medium">
                <a href="#" onclick="logoutUser()" class="text-slate-500 hover:text-slate-800 transition-colors inline-flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Logout safely
                </a>
            </div>
        </div>
    </div>

    <script>
        // Check session
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('student');
        
        let user = {};
        if (!token || !userStr) {
            window.location.href = 'student-login.html';
        } else {
            user = JSON.parse(userStr);
            document.getElementById('welcome-heading').textContent = "Change Password";
            document.getElementById('welcome-message').textContent = "Update your account security details.";
            document.getElementById('old-pwd-label').textContent = "Current Password";
            document.getElementById('oldPassword').placeholder = "Enter current password";
        }

        function logoutUser() {
            localStorage.clear();
            window.location.href = 'student-login.html';
        }

        let otpTimer = null;
        let isPasswordVerified = false;

        async function requestOTP() {
            const btn = document.getElementById('request-otp-btn');
            const status = document.getElementById('otp-status');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            status.textContent = '';
            status.className = 'text-xs mt-2 font-medium';

            try {
                const response = await fetch('/api/main?action=sendChangePasswordOtp', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (response.ok) {
                    status.textContent = 'OTP sent to your registered email.';
                    status.classList.add('text-green-600');
                    startOTPTimer();
                } else {
                    status.textContent = data.message || data.error || 'Failed to send OTP.';
                    status.classList.add('text-red-500');
                    btn.disabled = false;
                    btn.textContent = 'Send OTP';
                }
            } catch (error) {
                status.textContent = 'Network error. Please try again.';
                status.classList.add('text-red-500');
                btn.disabled = false;
                btn.textContent = 'Send OTP';
            }
        }

        function startOTPTimer() {
            const btn = document.getElementById('request-otp-btn');
            let remaining = 30;
            btn.textContent = `Wait ${remaining}s`;
            
            if (otpTimer) clearInterval(otpTimer);
            otpTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(otpTimer);
                    btn.disabled = false;
                    btn.textContent = 'Resend OTP';
                } else {
                    btn.textContent = `Wait ${remaining}s`;
                }
            }, 1000);
        }

        document.getElementById('change-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const otpCode = document.getElementById('otp').value;
            
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');

            if (newPassword !== confirmPassword) {
                errorText.textContent = 'New passwords do not match';
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');

            // --- STEP 1: Verify Password & Reveal OTP Section ---
            if (!isPasswordVerified) {
                submitBtn.disabled = true;
                btnText.textContent = 'Verifying Account...';

                try {
                    const response = await fetch('/api/main?action=verify-password', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ currentPassword: oldPassword })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        errorText.textContent = data.error || 'Password verification failed';
                        errorMsg.classList.remove('hidden');
                        submitBtn.disabled = false;
                        btnText.textContent = 'Verify & Get OTP';
                        return;
                    }

                    // Success! Reveal OTP section
                    isPasswordVerified = true;
                    document.getElementById('password-section').classList.add('opacity-50', 'pointer-events-none');
                    document.getElementById('otp-section').classList.remove('hidden');
                    document.getElementById('otp').required = true;
                    
                    submitBtn.disabled = false;
                    btnText.textContent = 'Finalize Password Update';

                    // Auto-request OTP
                    requestOTP();

                } catch (err) {
                    errorText.textContent = 'Network error during verification';
                    errorMsg.classList.remove('hidden');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Verify & Get OTP';
                }
                return;
            }

            // --- STEP 2: Finalize Update ---
            if (!otpCode) {
                errorText.textContent = 'Please enter the verification code';
                errorMsg.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            btnText.innerHTML = `
                <span class="flex items-center gap-2">
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Updating Password...
                </span>`;

            try {
                const response = await fetch('/api/main?action=change-password', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ oldPassword, newPassword, otp: otpCode })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorText.textContent = data.message || 'Update failed';
                    errorMsg.classList.remove('hidden');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Finalize Password Update';
                    return;
                }

                window.location.href = 'student-dashboard.html';

            } catch (error) {
                errorText.textContent = 'Connection Error';
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                btnText.textContent = 'Finalize Password Update';
            }
        });
    </script>
</body>

</html>
