<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | GeoAttend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 600: '#2563eb' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; padding: 20px; }
        .saas-card { background-color: #fff; border: 1px solid #f1f5f9; border-radius: 0.75rem; box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.05); }
        .badge-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; padding: 0.125rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; }
        .badge-danger { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 0.125rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; }
        .tab-btn { display: flex; align-items: center; gap: 1rem; padding: 0.875rem 1.25rem; border-radius: 0.875rem; font-size: 0.9375rem; font-weight: 600; width: 100%; transition: all 0.2s; }
        .tab-btn.active { background: #e0f2fe; color: #0369a1; }
        .tab-btn.inactive { color: #64748b; }
        .tab-btn.inactive:hover { background: #f8fafc; color: #1e293b; }
    </style>
</head>

<body>
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-6">
        <div id="sidebar" class="w-full md:w-64 saas-card flex flex-col h-full bg-white">
            <div class="p-10 border-b border-slate-50 flex flex-col items-center relative">
                <div id="user-initial" class="w-20 h-20 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-3xl font-bold mb-5 border border-blue-100/50">S</div>
                <h2 id="user-name" class="font-bold text-slate-900 text-2xl">Student</h2>
                <p id="user-info" class="text-sm text-slate-400 mt-1">rollNumber • email</p>
                <button onclick="logout()" class="mt-6 text-red-500 font-bold flex items-center gap-2 hover:text-red-700">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </button>
            </div>
            <div class="p-4 space-y-1.5 flex flex-col">
                <button class="tab-btn active"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</button>
                <button onclick="window.location.href='change-password.html'" class="tab-btn inactive"><i data-lucide="lock" class="w-4 h-4"></i> Change Password</button>
            </div>
        </div>

        <div class="flex-1 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Summary Cards -->
                <div class="saas-card p-6 flex items-center gap-5">
                    <div class="relative w-16 h-16 flex items-center justify-center">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                            <path class="stroke-slate-100" stroke-width="3" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path id="attendance-circle" class="stroke-[#0284c7]" stroke-dasharray="0, 100" stroke-width="3" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <span id="attendance-percent" class="absolute text-sm font-bold text-slate-800">0%</span>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Campus Presence</p>
                        <h3 class="text-2xl font-extrabold text-slate-900 mt-1"><span id="attendance-present">0</span> <span class="text-base font-semibold text-slate-400">/ <span id="attendance-total">0</span></span></h3>
                    </div>
                </div>

                <div class="saas-card p-6 flex flex-col justify-center">
                    <p class="text-xs font-bold text-slate-400 uppercase mb-3">Today Status</p>
                    <div class="space-y-2">
                        <p class="text-sm font-bold text-slate-800 flex items-center gap-2"><i data-lucide="log-in" class="w-4 h-4 text-green-500"></i> In: <span id="display-checkin" class="text-green-700">--:--</span></p>
                        <p class="text-sm font-bold text-slate-800 flex items-center gap-2"><i data-lucide="log-out" class="w-4 h-4 text-red-500"></i> Out: <span id="display-checkout" class="text-red-700">--:--</span></p>
                    </div>
                </div>

                <div class="saas-card p-6 bg-slate-900 flex items-center justify-between text-white overflow-hidden group">
                    <div class="relative z-10 w-full">
                        <h3 class="font-bold mb-1">Campus Tracker</h3>
                        <p id="tracking-status" class="text-xs text-blue-100 mb-4 font-medium opacity-90">Auto Attendance Detection</p>
                        <button onclick="startTracking()" id="startTrackingBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-sm">
                            <i data-lucide="navigation" class="w-4 h-4"></i> <span id="markText">Start Tracking</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="alert-box" class="hidden p-4 rounded-xl border"></div>

            <div class="saas-card p-6 flex flex-col h-[450px]">
                <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i data-lucide="map" class="w-5 h-5 text-[#0284c7]"></i> Live Geofence Radar</h3>
                <div id="student-map" class="flex-1 rounded-xl bg-slate-50 border flex items-center justify-center text-slate-400">Initializing Tracking...</div>
                <div class="mt-4 p-3 bg-slate-50 rounded-lg border grid grid-cols-2 gap-4">
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Your GPS</p><p id="your-gps" class="text-xs font-mono font-bold text-slate-700">--</p></div>
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Campus Center</p><p id="campus-center" class="text-xs font-mono font-bold text-slate-700">--</p></div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="saas-card p-6"><h3 class="font-bold text-slate-900 mb-4">Live Distance</h3><p class="text-3xl font-extrabold text-slate-900"><span id="distance">--</span></p></div>
                <div class="saas-card p-6"><h3 class="font-bold text-slate-900 mb-4">Presence Alert</h3><div id="presence-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-500 inline-block">Unknown</div></div>
            </div>

            <div class="saas-card overflow-hidden">
                <div class="p-5 border-b bg-slate-50/50 font-bold text-slate-900">Recent Attendance Logs</div>
                <div id="logs-container" class="divide-y divide-slate-100"></div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const token = localStorage.getItem('geoattend_token');
        const user = JSON.parse(localStorage.getItem('geoattend_user') || '{}');
        if (!token) window.location.href = 'student-login.html';

        document.getElementById('user-name').textContent = user.name || 'Student';
        document.getElementById('user-info').textContent = `${user.rollNumber || ''} • ${user.email}`;

        let map, marker, radius, campusCenter, lastStatus;

        // STEP 1: FETCH CAMPUS DATA FROM BACKEND
        async function initDashboard() {
            try {
                const res = await fetch("/api/get-campus", { headers: { "Authorization": "Bearer " + token } });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message);

                campusCenter = { lat: data.lat, lng: data.lng };
                radius = data.radius;

                document.getElementById("campus-center").innerText = `${data.lat.toFixed(6)}, ${data.lng.toFixed(6)}`;

                // STEP 2: INITIALIZE MAP CORRECTLY
                map = new google.maps.Map(document.getElementById("student-map"), {
                    center: campusCenter,
                    zoom: 17,
                    disableDefaultUI: true
                });

                new google.maps.Circle({
                    map,
                    center: campusCenter,
                    radius: radius,
                    fillColor: "#4f46e5",
                    fillOpacity: 0.2,
                    strokeColor: "#4f46e5",
                    strokeWeight: 2
                });

                fetchTodayStats();
            } catch (err) {
                console.error("Initialization error:", err);
                showAlert("Could not load campus data.", false);
            }
        }

        // STEP 3: FIX GPS TRACKING
        function startTracking() {
            document.getElementById('markText').textContent = "Tracking Active";
            document.getElementById('startTrackingBtn').classList.replace('bg-blue-600', 'bg-green-600');
            document.getElementById('startTrackingBtn').disabled = true;

            navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    updateLocation(lat, lng);
                },
                (err) => {
                    console.error(err);
                    showAlert("Please Enable GPS Permission", false);
                },
                { enableHighAccuracy: true }
            );
        }

        // STEP 4: UPDATE LOCATION FUNCTION
        function updateLocation(lat, lng) {
            const userPos = { lat, lng };
            console.log("Live location:", lat, lng);

            document.getElementById("your-gps").innerText = lat.toFixed(6) + ", " + lng.toFixed(6);

            if (!marker) {
                marker = new google.maps.Marker({
                    position: userPos,
                    map: map,
                    icon: "http://maps.google.com/mapfiles/ms/icons/green-dot.png"
                });
            } else {
                marker.setPosition(userPos);
            }

            map.panTo(userPos);
            calculateDistance(lat, lng);
        }

        // STEP 5: FIX DISTANCE CALCULATION
        function calculateDistance(lat, lng) {
            if (!campusCenter) return;

            const R = 6371000;
            const dLat = (lat - campusCenter.lat) * Math.PI / 180;
            const dLng = (lng - campusCenter.lng) * Math.PI / 180;

            const a =
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(campusCenter.lat * Math.PI/180) *
                Math.cos(lat * Math.PI/180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;

            document.getElementById("distance").innerText = Math.round(distance) + " meters";

            // STEP 6: FIX ATTENDANCE LOGIC
            const currentStatus = distance <= radius ? "IN" : "OUT";
            
            const badge = document.getElementById('presence-badge');
            if (currentStatus === "IN") {
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700 inline-block';
                badge.textContent = "✅ Inside Campus";
            } else {
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700 inline-block';
                badge.textContent = "❌ Outside Campus";
            }

            if (lastStatus !== currentStatus) {
                checkAttendance(distance);
                lastStatus = currentStatus;
            }
        }

        function checkAttendance(distance) {
            if (distance <= radius) {
                markAttendance("IN");
            } else {
                markAttendance("OUT");
            }
        }

        // STEP 7: CALL BACKEND FOR ATTENDANCE
        async function markAttendance(type) {
            try {
                const res = await fetch("/api/attendance", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ type })
                });
                const data = await res.json();
                if (data.message) showAlert(data.message, res.ok);
                fetchTodayStats();
            } catch (err) {
                console.error("Mark attendance error:", err);
            }
        }

        // STEP 8: REMOVE HARDCODED UI & FETCH FROM BACKEND
        async function fetchTodayStats() {
            try {
                const res = await fetch("/api/attendance-today", { headers: { "Authorization": "Bearer " + token } });
                const data = await res.json();
                
                document.getElementById('attendance-present').textContent = data.stats.present;
                document.getElementById('attendance-total').textContent = data.stats.total;
                
                const pct = data.stats.total ? Math.round((data.stats.present / data.stats.total) * 100) : 0;
                document.getElementById('attendance-percent').textContent = pct + '%';
                document.getElementById('attendance-circle').setAttribute('stroke-dasharray', `${pct}, 100`);

                if (data.today) {
                    document.getElementById('display-checkin').textContent = data.today.check_in_time || '--:--';
                    document.getElementById('display-checkout').textContent = data.today.check_out_time || '--:--';
                }

                // Also fetch full logs
                fetchLogs();
            } catch (err) {
                console.error("Fetch stats error:", err);
            }
        }

        async function fetchLogs() {
            try {
                const res = await fetch(`/api/attendance?action=getAttendanceLogs`, { headers: { 'Authorization': `Bearer ${token}` } });
                const logs = await res.json();
                const container = document.getElementById('logs-container');
                container.innerHTML = logs.map(l => `
                    <div class="p-4 flex justify-between items-center text-sm">
                        <div><p class="font-bold text-slate-900">${l.date}</p><p class="text-slate-400">${l.checkinTime} - ${l.checkoutTime || '...'}</p></div>
                        <span class="${l.status === 'Present' || l.status === 'completed' ? 'badge-success' : 'badge-danger'}">${l.status}</span>
                    </div>`).join('');
            } catch (err) { console.error(err); }
        }

        function showAlert(msg, success) {
            const box = document.getElementById('alert-box');
            box.innerText = msg; box.className = `p-4 rounded-xl border mb-4 ${success ? 'bg-green-50 text-green-800 border-green-200' : 'bg-red-50 text-red-800 border-red-200'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 5000);
        }

        window.initMap = initDashboard;
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtcv3jZIS7M7bmf4Mwirbhd1qVulafbvk&callback=initMap" async defer></script>
</body>
</html>
