<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Signup | GeoAttend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .saas-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            color: #0f172a;
            outline: 2px solid transparent;
            outline-offset: 2px;
            transition-property: all;
            transition-duration: 200ms;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .saas-input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 1px #0284c7;
        }

        .saas-card {
            background-color: #ffffff;
            border: 1px solid #f1f5f9;
            border-radius: 0.75rem;
            box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }

        .saas-card:hover {
            box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.08);
        }

        .input-error {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 1px #ef4444 !important;
        }

        .btn-primary {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background-color: #0284c7;
            color: #ffffff;
            border-radius: 0.5rem;
            font-weight: 600;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>

<body>
    <div class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
        <!-- Background design elements -->
        <div
            class="absolute top-0 right-0 w-[600px] h-[600px] bg-[#0284c7]/5 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2">
        </div>
        <div
            class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-indigo-50/50 rounded-full blur-3xl transform -translate-x-1/2 translate-y-1/2">
        </div>

        <div class="w-full max-w-md relative z-10 my-10">
            <!-- Logo Area -->
            <div class="text-center mb-8">
                <div
                    class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-[#0284c7] text-white shadow-[0_8px_16px_rgba(2,132,199,0.2)] mb-4">
                    <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Register College</h2>
                <p class="mt-2 text-slate-500 font-medium text-sm">Create an administrator account to manage your
                    institution</p>
            </div>

            <div class="saas-card p-8 sm:p-10 relative overflow-hidden">
                <!-- Top highlight bar -->
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-[#0284c7] to-indigo-500"></div>

                <form id="signup-form" class="space-y-6">
                    <div class="space-y-4">
                        <div>
                            <label
                                class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Name</label>
                            <input type="text" id="name" required class="saas-input" placeholder="Enter your name" autocomplete="name">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Email
                                Address</label>
                            <input type="email" id="email" required class="saas-input" placeholder="Enter your email" autocomplete="email">
                            <p id="email-error" class="text-xs text-red-500 mt-1 hidden"></p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">
                                Password
                            </label>
                            <input type="password" id="password" required minlength="6" class="saas-input"
                                placeholder="Enter your password" autocomplete="new-password">
                            <p id="password-error" class="text-xs text-red-500 mt-1 hidden"></p>
                            <p class="text-xs text-slate-400 mt-1 font-medium" id="password-helper">Minimum 6 characters
                            </p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">
                                Confirm Password
                            </label>
                            <input type="password" id="confirmPassword" required class="saas-input"
                                placeholder="Confirm your password" autocomplete="new-password">
                            <p id="confirm-password-error" class="text-xs text-red-500 mt-1 hidden"></p>
                        </div>

                    </div>

                    <!-- OTP Section (Hidden initially) -->
                    <div id="otp-section" class="hidden space-y-4 pt-4 border-t border-slate-100">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">
                                Verification Code (OTP)
                            </label>
                            <input type="text" id="otp"
                                class="saas-input text-center text-lg tracking-[0.5em] font-mono" placeholder="------"
                                maxlength="6">
                            <p id="otp-error" class="text-xs text-red-500 mt-1 hidden"></p>
                            <p class="text-xs text-slate-500 mt-2">Enter the 6-digit code sent to your email.</p>
                            <!-- Resend OTP Timer -->
                            <div class="mt-3 text-center">
                                <span id="resend-timer" class="text-xs text-slate-400 font-medium">Resend OTP in <span id="resend-countdown">30</span>s</span>
                                <button type="button" id="resend-btn" onclick="resendOtp()"
                                    class="hidden text-xs font-bold text-[#0284c7] hover:text-[#0369a1] transition-colors underline-offset-2 underline">
                                    Resend OTP
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="error-msg"
                        class="hidden bg-red-50 border border-red-100 text-red-600 text-sm py-3 px-4 rounded-lg font-medium flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-red-500 shrink-0"></span>
                        <span id="error-text"></span>
                    </div>

                    <div id="success-msg"
                        class="hidden bg-green-50 border border-green-100 text-green-600 text-sm py-3 px-4 rounded-lg font-medium flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-500 shrink-0"></span>
                        <span id="success-text">Admin account created successfully! Redirecting...</span>
                    </div>

                    <button type="submit" id="submit-btn" class="btn-primary py-3.5 text-base w-full">
                        <span id="btn-text">Verify Email & Send OTP</span>
                    </button>
                </form>
            </div>

            <!-- Login Link -->
            <div class="mt-8 text-center text-sm font-medium">
                <span class="text-slate-500">Already have an account?</span>
                <a href="admin-login.html"
                    class="text-[#0284c7] hover:text-[#0369a1] transition-colors font-bold ml-1">Log in</a>
            </div>

            <!-- Back Link -->
            <div class="mt-4 text-center text-sm font-medium">
                <a href="index.html"
                    class="text-slate-500 hover:text-slate-800 transition-colors inline-flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Back to GeoAttend
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const successMsg = document.getElementById('success-msg');
            const otpSection = document.getElementById('otp-section');
            const otpInput = document.getElementById('otp');

            // Determine if we are in Step 1 (Send OTP) or Step 2 (Verify & Signup)
            const isStepTwo = !otpSection.classList.contains('hidden');

            // Clear previous errors
            document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
            ['email-error', 'password-error', 'confirm-password-error', 'otp-error'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.add('hidden');
                    el.textContent = '';
                }
            });

            let isValid = true;

            // Email Validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('email').classList.add('input-error');
                const emailError = document.getElementById('email-error');
                emailError.textContent = 'Invalid email address';
                emailError.classList.remove('hidden');
                isValid = false;
            }

            // Password Requirements
            if (password.length < 6) {
                document.getElementById('password').classList.add('input-error');
                const passwordError = document.getElementById('password-error');
                passwordError.textContent = 'Password must be at least 6 characters.';
                passwordError.classList.remove('hidden');
                isValid = false;
            }

            // Password Match Validation
            if (password !== confirmPassword) {
                document.getElementById('confirmPassword').classList.add('input-error');
                const confirmPasswordError = document.getElementById('confirm-password-error');
                confirmPasswordError.textContent = 'Passwords do not match';
                confirmPasswordError.classList.remove('hidden');
                isValid = false;
            }

            if (!isValid) {
                errorMsg.classList.add('hidden');
                successMsg.classList.add('hidden');
                return;
            }

            if (isStepTwo) {
                // Step 2: Verify OTP and Create Account
                const otpValue = otpInput.value.trim();

                if (!otpValue || otpValue.length !== 6) {
                    otpInput.classList.add('input-error');
                    const otpError = document.getElementById('otp-error');
                    otpError.textContent = 'Please enter a valid 6-digit OTP.';
                    otpError.classList.remove('hidden');
                    return;
                }

                submitBtn.disabled = true;
                btnText.innerHTML = `
                    <span class="flex items-center gap-2">
                        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        Creating account...
                    </span>`;
                errorMsg.classList.add('hidden');
                
                try {
                    const response = await fetch('/api/main?action=adminSignup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password, otp: otpValue })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        if (data.message.includes('OTP') || data.message.includes('attempts')) {
                            otpInput.classList.add('input-error');
                            const otpError = document.getElementById('otp-error');
                            otpError.textContent = data.message;
                            otpError.classList.remove('hidden');
                        } else {
                            errorText.textContent = data.message || 'Signup failed';
                            errorMsg.classList.remove('hidden');
                        }
                        submitBtn.disabled = false;
                        btnText.textContent = 'Create Account';
                        return;
                    }

                    successMsg.classList.remove('hidden', 'bg-amber-50', 'text-amber-600', 'border-amber-100', 'bg-blue-50', 'text-blue-600', 'border-blue-100');
                    successMsg.classList.add('bg-green-50', 'text-green-600', 'border-green-100');
                    document.getElementById('success-text').textContent = 'Account created successfully! Redirecting...';
                    
                    setTimeout(() => {
                        window.location.href = 'admin-login.html';
                    }, 2000);
                } catch (error) {
                    console.error("Signup error:", error);
                    errorText.textContent = 'A network error occurred. Please try again.';
                    errorMsg.classList.remove('hidden');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Create Account';
                }
                return;
            }

            // Step 1: Send OTP request
            submitBtn.disabled = true;
            btnText.innerHTML = `
                <span class="flex items-center gap-2">
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Verifying...
                </span>`;
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            try {
                const response = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorText.textContent = data.message || 'Verification service failed.';
                    errorMsg.classList.remove('hidden');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Verify Email & Send OTP';
                    return;
                }

                // Success sending OTP
                successMsg.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'border-red-100');
                successMsg.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-100');
                document.getElementById('success-text').textContent = 'Verification code sent to your email!';

                // Lock initial fields
                document.querySelectorAll('.saas-input:not(#otp)').forEach(input => {
                    input.readOnly = true;
                    input.classList.add('bg-slate-50', 'text-slate-500', 'cursor-not-allowed');
                });

                // Show OTP section
                otpSection.classList.remove('hidden');
                submitBtn.disabled = false;
                btnText.textContent = 'Create Account';

                startResendTimer();
                setTimeout(() => otpInput.focus(), 100);

            } catch (error) {
                console.error("OTP send error:", error);
                errorText.textContent = 'Could not reach server. Please try again.';
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                btnText.textContent = 'Verify Email & Send OTP';
            }
        });

        // --- Resend OTP Logic ---
        let resendTimerInterval = null;

        function startResendTimer(seconds = 30) {
            clearInterval(resendTimerInterval);
            const countdownEl = document.getElementById('resend-countdown');
            const timerEl = document.getElementById('resend-timer');
            const resendBtn = document.getElementById('resend-btn');

            timerEl.classList.remove('hidden');
            resendBtn.classList.add('hidden');
            let remaining = seconds;
            countdownEl.textContent = remaining;

            resendTimerInterval = setInterval(() => {
                remaining--;
                countdownEl.textContent = remaining;
                if (remaining <= 0) {
                    clearInterval(resendTimerInterval);
                    timerEl.classList.add('hidden');
                    resendBtn.classList.remove('hidden');
                }
            }, 1000);
        }

        async function resendOtp() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resendBtn = document.getElementById('resend-btn');
            const successMsg = document.getElementById('success-msg');
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');

            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';

            try {
                const response = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    successMsg.classList.remove('hidden', 'bg-amber-50', 'bg-red-50');
                    successMsg.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-100');
                    document.getElementById('success-text').textContent = 'New verification code sent!';
                    document.getElementById('otp').value = '';
                    document.getElementById('otp').focus();
                    startResendTimer();
                } else {
                    errorText.textContent = data.message || 'Failed to resend OTP.';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorText.textContent = 'Connection error. Please try again.';
                errorMsg.classList.remove('hidden');
            }
            resendBtn.disabled = false;
            resendBtn.textContent = 'Resend OTP';
        }
    </script>
</body>

</html>
